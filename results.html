<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved Results — Grade 6 FAST Practice</title>
<style>
:root{--navy:#12395f;--blue:#1c6fba;--gray-bar:#e8ecef;--line:#c6ced6;--text:#16202a;
  --muted:#5b6976;--ok:#1d7a45;--bad:#b3261e;--bg:#f4f6f8}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:17px;line-height:1.5;color:var(--text);background:var(--bg)}
header{background:var(--navy);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;
  align-items:center;gap:12px;flex-wrap:wrap}
header a{color:#cfe2f5}
main{max-width:1000px;margin:16px auto;background:#fff;border:1px solid var(--line);border-radius:8px;
  padding:18px}
h1{font-size:20px;margin:0}
h2{font-size:19px;margin:20px 0 8px}
table{border-collapse:collapse;width:100%;margin-top:10px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;font-size:16px}
th{background:var(--gray-bar)}
tr.att{cursor:pointer}
tr.att:hover{background:#f2f7fc}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--bad);font-weight:600}
.bar{background:var(--gray-bar);border-radius:4px;height:12px;overflow:hidden;min-width:110px;display:inline-block;
  vertical-align:middle;width:160px}
.bar>i{display:block;height:100%;background:var(--blue)}
.hint{color:var(--muted);font-size:15px}
.detail{background:#fbfdff;border:1px solid var(--line);border-radius:8px;padding:14px;margin:10px 0}
.item{border-top:1px solid var(--line);padding:10px 0}
.item:first-of-type{border-top:none}
.yours{color:var(--bad)}.right{color:var(--ok)}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:13px;background:var(--gray-bar);
  color:var(--muted);margin-left:6px}
button{min-height:42px;padding:8px 16px;border-radius:6px;border:1px solid var(--line);background:#fff;
  cursor:pointer;font-size:16px}
button.primary{background:var(--blue);color:#fff;border:none}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
select,input{min-height:42px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;font-size:16px}
code{background:var(--gray-bar);padding:1px 5px;border-radius:4px;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>Saved results</h1>
  <div><a href="index.html">Back to the practice tests</a></div>
</header>
<main>
  <div class="hint" id="status">Loading results from the repository…</div>
  <div class="filters" id="filters" hidden>
    <label>Test <select id="fTest"><option value="">all</option></select></label>
    <label>Student <select id="fWho"><option value="">all</option></select></label>
    <button id="reload">Refresh</button>
    <span class="hint" id="count"></span>
  </div>
  <div id="summary"></div>
  <div id="list"></div>
</main>
<script>
"use strict";
const REPO = "Taher-Github/fast6-practice";
const API = "https://api.github.com/repos/" + REPO;
const RAW = "https://raw.githubusercontent.com/" + REPO + "/main/";
let ATTEMPTS = [], QUESTIONS = null;

const el = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtAns = a => a === null || a === undefined || a === "" ? "(no answer)"
  : Array.isArray(a) ? a.map(x => Array.isArray(x) ? "(" + x.join(", ") + ")" : x).join(", ")
  : typeof a === "object" ? Object.keys(a).map(k => k + " → " + a[k]).join("; ") : String(a);

async function loadList(){
  const r = await fetch(API + "/git/trees/main?recursive=1");
  if (!r.ok) throw new Error("Could not list the repository (" + r.status + ")");
  const t = await r.json();
  return (t.tree || []).filter(n => n.type === "blob" && /^results\/.+\.json$/.test(n.path))
                       .map(n => n.path);
}
async function loadAll(){
  el("status").textContent = "Loading results from the repository…";
  let paths;
  try { paths = await loadList(); }
  catch (e) { el("status").textContent = e.message; return; }
  if (!paths.length){
    el("status").innerHTML = "No results saved yet. Finished tests appear here automatically once the "
      + "results relay is set up (see <code>SETUP_RESULTS.md</code> in the repository).";
    return;
  }
  const out = [];
  for (const p of paths){
    try {
      const r = await fetch(RAW + p);
      if (r.ok){ const a = await r.json(); a._path = p; out.push(a); }
    } catch (e) { /* skip unreadable file */ }
  }
  out.sort((a, b) => String(b.finished || "").localeCompare(String(a.finished || "")));
  ATTEMPTS = out;
  el("status").hidden = true;
  el("filters").hidden = false;
  buildFilters();
  render();
}
function buildFilters(){
  const tests = [...new Set(ATTEMPTS.map(a => a.test))].sort((x, y) => x - y);
  const whos = [...new Set(ATTEMPTS.map(a => a.student || "—"))].sort();
  el("fTest").innerHTML = '<option value="">all</option>' +
    tests.map(t => `<option value="${t}">Test ${t}</option>`).join("");
  el("fWho").innerHTML = '<option value="">all</option>' +
    whos.map(w => `<option value="${esc(w)}">${esc(w)}</option>`).join("");
  el("fTest").onchange = el("fWho").onchange = render;
  el("reload").onclick = loadAll;
}
function filtered(){
  const t = el("fTest").value, w = el("fWho").value;
  return ATTEMPTS.filter(a => (!t || String(a.test) === t) && (!w || (a.student || "—") === w));
}
function render(){
  const rows = filtered();
  el("count").textContent = rows.length + " attempt" + (rows.length === 1 ? "" : "s");
  // per-test summary
  const byTest = {};
  rows.forEach(a => { (byTest[a.test] = byTest[a.test] || []).push(a.pct); });
  let h = "<h2>By test</h2><table><tr><th>Test</th><th>Attempts</th><th>Best</th><th>Latest</th><th>Average</th></tr>";
  Object.keys(byTest).map(Number).sort((a, b) => a - b).forEach(t => {
    const p = byTest[t];
    const avg = Math.round(p.reduce((s, x) => s + x, 0) / p.length);
    h += `<tr><td>Test ${t}</td><td>${p.length}</td><td>${Math.max(...p)}%</td>
      <td>${p[0]}%</td><td><span class="bar"><i style="width:${avg}%"></i></span> ${avg}%</td></tr>`;
  });
  h += "</table>";
  // weakest benchmarks across the filtered attempts
  const bm = {};
  rows.forEach(a => Object.keys(a.by_benchmark || {}).forEach(k => {
    bm[k] = bm[k] || [0, 0];
    bm[k][0] += a.by_benchmark[k].correct; bm[k][1] += a.by_benchmark[k].total;
  }));
  const weak = Object.keys(bm).map(k => [k, bm[k][0] / bm[k][1], bm[k]])
    .sort((a, b) => a[1] - b[1]).slice(0, 10);
  if (weak.length){
    h += "<h2>Benchmarks to work on</h2><table><tr><th>Benchmark</th><th>Correct</th><th></th></tr>";
    weak.forEach(([k, f, c]) => {
      h += `<tr><td>${esc(k)}</td><td>${c[0]}/${c[1]}</td>
        <td><span class="bar"><i style="width:${Math.round(f * 100)}%"></i></span> ${Math.round(f * 100)}%</td></tr>`;
    });
    h += "</table>";
  }
  h += "<h2>Attempts</h2><table><tr><th>Finished</th><th>Student</th><th>Test</th><th>Score</th>"
     + "<th>Result</th><th>Mode</th></tr>";
  rows.forEach((a, i) => {
    const when = a.finished ? new Date(a.finished).toLocaleString() : "—";
    h += `<tr class="att" data-i="${i}"><td>${esc(when)}</td><td>${esc(a.student || "—")}</td>
      <td>Test ${a.test}</td><td>${a.score}/${a.total} · ${a.pct}%</td>
      <td class="${a.pct >= (a.threshold || 60) ? "pass" : "fail"}">
        ${a.pct >= (a.threshold || 60) ? "pass" : "below " + (a.threshold || 60) + "%"}</td>
      <td>${a.practice ? "practice" : "timed"}</td></tr>
      <tr id="d${i}" hidden><td colspan="6"><div class="detail" id="dd${i}">…</div></td></tr>`;
  });
  h += "</table>";
  el("summary").innerHTML = "";
  el("list").innerHTML = h;
  document.querySelectorAll("tr.att").forEach(tr => tr.onclick = () => toggle(+tr.dataset.i, rows));
}
async function toggle(i, rows){
  const row = el("d" + i);
  row.hidden = !row.hidden;
  if (row.hidden) return;
  const a = rows[i];
  if (!QUESTIONS){
    try { QUESTIONS = await (await fetch("questions.json")).json(); }
    catch (e) { QUESTIONS = []; }
  }
  const byId = {};
  QUESTIONS.forEach(q => byId[q.id] = q);
  const missed = (a.items || []).filter(x => !x.correct);
  let h = `<div class="hint">${esc(a._path)} · ${missed.length} missed of ${a.items.length}
    · total time ${Math.round((a.items || []).reduce((s, x) => s + (x.seconds || 0), 0) / 60)} min</div>`;
  h += "<h2 style='font-size:17px'>By reporting category</h2>";
  Object.keys(a.by_category || {}).forEach(k => {
    const c = a.by_category[k];
    h += `<div>${esc(k)} — ${c.correct}/${c.total}
      <span class="bar"><i style="width:${Math.round(c.correct / c.total * 100)}%"></i></span></div>`;
  });
  h += "<h2 style='font-size:17px'>Missed items</h2>";
  missed.forEach(x => {
    const q = byId[x.id];
    h += `<div class="item"><b>${esc(x.id)}</b> <span class="badge">${esc(x.benchmark)}</span>
      <span class="badge">${esc(x.difficulty)}</span><span class="badge">${esc(x.seconds || 0)}s</span>
      ${x.flagged ? '<span class="badge">flagged</span>' : ""}
      <div>${q ? esc(q.stem).replace(/\n/g, "<br>") : "(stem unavailable)"}</div>
      <div class="yours">Answer given: ${esc(fmtAns(x.response))}</div>
      <div class="right">Correct: ${esc(fmtAns(x.key))}</div>
      ${q ? `<div class="hint">${esc(q.explanation)}</div>` : ""}</div>`;
  });
  el("dd" + i).innerHTML = h;
}
loadAll();
</script>
</body>
</html>
